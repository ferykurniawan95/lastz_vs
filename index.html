<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAST Z : SURVIVAL SHOOTER</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
        }
        
        .logo {
            max-width: 280px; 
            height: auto;     
            margin-bottom: 20px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 40px;
        }

        /* Menggunakan Flexbox untuk menata ikon di kiri & teks di kanan */
        .event-card {
            background: #1c212b;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: 0.2s;
            
            display: flex;          /* Mengatur tata letak menyamping */
            align-items: center;    /* Menyejajarkan posisi secara vertikal (tengah) */
            justify-content: center;
            text-align: left;       /* Teks menjadi rata kiri */
            gap: 20px;              /* Jarak antara ikon dan teks */
        }

        .event-card:hover {
            transform: translateY(-3px);
            border-color: #ffcc00;
        }

        /* Ukuran Ikon PNG */
        .icon {
            width: 50px;            /* Atur ukuran ikon sesuai kebutuhan */
            height: auto;
            flex-shrink: 0;         /* Mencegah gambar menyusut */
        }

        /* Pembungkus teks di sebelah kanan */
        .event-info {
            display: flex;
            flex-direction: column;
        }

        .event-title {
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .event-description {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- LOGO --> 
        <img src="logo.png" alt="LAST Z Survival Shooter Logo" class="logo">
        
        <div class="subtitle">
            Choose Your Category
        </div>

        <!-- EVENT CARD -->
        <div class="event-card" onclick="openAllianceDuel()">

            <!-- IKON (SEBELAH KIRI) -->
            <img src="vs.png" alt="Alliance Duel Icon" class="icon">

            <!-- TEKS (SEBELAH KANAN) -->
            <div class="event-info">
                <!-- <div class="event-title"> -->
                    ALLIANCE DUEL
                <!-- </div> -->
            </div>

        </div>

    </div>

    <script>
        function openAllianceDuel() {
            window.location.href = "alliance.html";
        }
    </script>

</body>
</html>
