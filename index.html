<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAST Z : SURVIVAL SHOOTER</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
        }
        
        .logo {
            max-width: 280px; /* Ubah angka ini sesuai ukuran yang diinginkan */
            height: auto;     /* Menjaga proporsi gambar */
            margin-bottom: 20px;
        }
        
        h1 {
            color: #ffcc00;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 40px;
        }

        .event-card {
            background: #1c212b;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .event-card:hover {
            transform: translateY(-3px);
            border-color: #ffcc00;
        }

        .icon {
            width: 60px;       /* Sesuaikan lebar gambar sesuai kebutuhan */
            height: auto;      /* Mempertahankan rasio tinggi gambar */
            margin-bottom: 10px;
        }

        .event-title {
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }

        .event-description {
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- LOGO --> 
        <img src="logo.png" alt="LAST Z Survival Shooter Logo" class="logo" >
        
        <!-- <h1>LAST Z : SURVIVAL SHOOTER</h1>  -->

        <div class="subtitle">
            Choose Your Category
        </div>

        <div class="event-card" onclick="openAllianceDuel()">
            <div class="event-title">
                <img src="vs.png" alt="Alliance Duel Icon" class="icon">
                ALLIANCE DUEL
            </div>

            <div class="event-description">
                CALCULATE YOUR POINTS
            </div>

        </div>

    </div>

    <script>
        function openAllianceDuel() {
            window.location.href = "alliance.html";
        }
    </script>

</body>
</html>
