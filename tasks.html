<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alliance Duel - Day 1 Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 25px 15px 100px;
        }

        /* Back Button */
        .back-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            text-decoration: none;
            margin-bottom: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1c212b;
            border: 1px solid #333;
            transition: 0.2s;
        }

        .back-icon:hover {
            color: #ffcc00;
            border-color: #ffcc00;
            transform: translateX(-3px);
        }

        .back-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Header */
        h1 {
            color: #ffcc00;
            text-align: center;
            margin: 5px 0 8px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* Total Score */
        .total-box {
            position: sticky;
            top: 10px;
            z-index: 10;

            background: linear-gradient(135deg, #242b38, #1a1f29);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 18px;
            text-align: center;
            margin-bottom: 20px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .total-label {
            color: #aaa;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-points {
            color: #ffcc00;
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Task List */
        .tasks {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-card {
            background: #1c212b;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px;
            transition: 0.2s;
        }

        .task-card:focus-within {
            border-color: #ffcc00;
        }

        .task-name {
            color: #eee;
            font-size: 18px;
            line-height: 1.4;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .task-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .points {
            color: #ffcc00;
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
        }

        .input-box {
            width: 110px;
            padding: 9px 10px;
            background: #10131a;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            outline: none;
            text-align: right;
            font-size: 14px;
        }

        .input-box:focus {
            border-color: #ffcc00;
        }

        .input-box::-webkit-inner-spin-button,
        .input-box::-webkit-outer-spin-button {
            opacity: 1;
        }

        /* Reset Button */
        .reset-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #1c212b;
            color: #aaa;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-btn:hover {
            color: #ffcc00;
            border-color: #ffcc00;
        }

        /* Mobile */
        @media (max-width: 500px) {
            .container {
                padding: 20px 12px 80px;
            }

            h1 {
                font-size: 23px;
            }

            .total-points {
                font-size: 28px;
            }

            .task-name {
                font-size: 13px;
            }

            .input-box {
                width: 90px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Back Button -->
    <a class="back-icon" href="index.html" aria-label="Back">
        <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l8 8-8 8 1.41 1.41L16.17 13H20v-2z"/>
        </svg>
    </a>

    <!-- Header -->
    <h1 id="pageTitle">DAY 1</h1>
    <div class="subtitle" id="pageSubtitle">
        Mod Vehicle Boost
    </div>

    <!-- Total Score -->
    <div class="total-box">
        <div class="total-label">Total Alliance Duel Points</div>
        <div class="total-points" id="totalPoints">0</div>
    </div>

    <!-- Tasks -->
    <div class="tasks" id="taskList"></div>

    <!-- Reset -->
    <button class="reset-btn" onclick="resetCalculator()">
        Reset All
    </button>

</div>

<script>

        {

        },

        {

        {

    /*

    const day2Tasks = [

        },

        },

        },
    
        {

            points: 8700
        },
    
        {

            points: 30
        }
    
    ];

    /*
     * ==========================================
     * DAY 3 - AGE OF SCIENCE
     * ==========================================
     */
    const day3Tasks = [
    
    ];

    /*
     * ==========================================
     * DAY 4 - HERO PROGRESSION
     * ==========================================
     */
    const day4Tasks = [
    
    ];

    /*
     * ==========================================
     * DAY 5 - JOLISTIC GROWTH
     * ==========================================
     */
    const day5Tasks = [
    
    ];

    /*
     * ==========================================
     * DAY 6 - ENEMY BOOSTER
     * ==========================================
     */
    const day6Tasks = [
    
    ];    
    
    /*
     * ==========================================
     * DAY DATA
     * ==========================================
     */

    const days = {
        1: {
            title: "DAY 1",
            subtitle: "Mod Vehicle Boost",
            tasks: day1Tasks
        },
        2: {
            title: "DAY 2",
            subtitle: "Shelter Upgrade",
            tasks: day2Tasks
        },
        3: {
            title: "DAY 3",
            subtitle: "Age Of Science",
            tasks: day3Tasks
        },
        4: {
            title: "DAY 4",
            subtitle: "Hero Progression",
            tasks: day4Tasks
        },
        5: {
            title: "DAY 5",
            subtitle: "Holistic Growth",
            tasks: day5Tasks
        },
        6: {
            title: "DAY 6",
            subtitle: "Enemy Buster",
            tasks: day6Tasks
        }
        // Day 2, 3, 4, 5 and 6
        // can be added here later.
    };
    


    /*
     * ==========================================
     * GET DAY FROM URL
     * ==========================================
     */

    const params = new URLSearchParams(window.location.search);

    const selectedDay = params.get("day") || "1";

    const currentDay = days[selectedDay] || days[1];


    /*
     * ==========================================
     * DISPLAY HEADER
     * ==========================================
     */

    document.getElementById("pageTitle").textContent =
        currentDay.title;

    document.getElementById("pageSubtitle").textContent =
        currentDay.subtitle;


    /*
     * ==========================================
     * CREATE TASK CARDS
     * ==========================================
     */

    const taskList = document.getElementById("taskList");
    
    currentDay.tasks.forEach((task, index) => {
    
        const card = document.createElement("div");
    
        card.className = "task-card";
    
        // SPEED UP TASK
        if (task.type === "speedup") {
    
            card.innerHTML = `
                <div class="task-name">
                    ${task.name}
                </div>
    
                <div class="task-bottom" style="display:block;">
    
                    <div class="points">
                        ${formatNumber(task.points)} pts / minute
                    </div>
    
                    <div style="
                        display:flex;
                        gap:8px;
                        margin-top:12px;
                        justify-content:flex-end;
                    ">
    
                        <div>
                            <input
                                type="number"
                                min="0"
                                step="1"
                                value="0"
                                class="input-box speed-input"
                                data-index="${index}"
                                data-type="days"
                                placeholder="Days"
                                aria-label="Speed Up Days"
                            >
                            <div style="
                                color:#777;
                                font-size:11px;
                                margin-top:3px;
                            ">Days</div>
                        </div>
    
                        <div>
                            <input
                                type="number"
                                min="0"
                                step="1"
                                value="0"
                                class="input-box speed-input"
                                data-index="${index}"
                                data-type="hours"
                                placeholder="Hours"
                                aria-label="Speed Up Hours"
                            >
                            <div style="
                                color:#777;
                                font-size:11px;
                                margin-top:3px;
                            ">Hours</div>
                        </div>
    
                        <div>
                            <input
                                type="number"
                                min="0"
                                step="1"
                                value="0"
                                class="input-box speed-input"
                                data-index="${index}"
                                data-type="minutes"
                                placeholder="Minutes"
                                aria-label="Speed Up Minutes"
                            >
                            <div style="
                                color:#777;
                                font-size:11px;
                                margin-top:3px;
                            ">Minutes</div>
                        </div>
    
                    </div>
    
                </div>
            `;
        }
    
        // STRUCTURE POWER TASK
        else if (task.type === "structure") {
    
            card.innerHTML = `
                <div class="task-name">
                    ${task.name}
                </div>
    
                <div class="task-bottom" style="display:block;">
    
                    <div class="points">
                        ${formatNumber(task.points)} pts / 10 Power
                    </div>
    
                    <div style="
                        display:flex;
                        gap:8px;
                        margin-top:12px;
                        justify-content:flex-end;
                        align-items:center;
                    ">
    
                        <div>
                            <input
                                type="number"
                                min="0"
                                step="1"
                                value="0"
                                class="input-box structure-input"
                                data-index="${index}"
                                data-type="before"
                                placeholder="Before"
                                aria-label="Structure Power Before Upgrade"
                            >
                            <div style="
                                color:#777;
                                font-size:11px;
                                margin-top:3px;
                            ">Before</div>
                        </div>
    
                        <div style="color:#777;">
                            →
                        </div>
    
                        <div>
                            <input
                                type="number"
                                min="0"
                                step="1"
                                value="0"
                                class="input-box structure-input"
                                data-index="${index}"
                                data-type="after"
                                placeholder="After"
                                aria-label="Structure Power After Upgrade"
                            >
                            <div style="
                                color:#777;
                                font-size:11px;
                                margin-top:3px;
                            ">After</div>
                        </div>
    
                    </div>
    
                </div>
            `;
        }
    
        // NORMAL TASK
        else {
    
            card.innerHTML = `
                <div class="task-name">
                    ${task.name}
                </div>
    
                <div class="task-bottom">
    
                    <div class="points">
                        ${formatNumber(task.points)} pts
                    </div>
    
                    <input
                        type="number"
                        min="0"
                        step="1"
                        value="0"
                        class="input-box"
                        data-index="${index}"
                        data-type="normal"
                        aria-label="${task.name}"
                    >
    
                </div>
            `;
        }
    
        taskList.appendChild(card);
    });



    /*
     * ==========================================
     * CALCULATE TOTAL
     * ==========================================
     */

    document.querySelectorAll(".input-box").forEach(input => {

        input.addEventListener("input", calculateTotal);

    });


    function calculateTotal() {

        let total = 0;

        document.querySelectorAll(".input-box").forEach(input => {

            let quantity = parseFloat(input.value) || 0;

            const index = parseInt(input.dataset.index);

            const points = currentDay.tasks[index].points;

            total += quantity * points;

        });

        document.getElementById("totalPoints").textContent =
            formatNumber(total);
    }


    /*
     * ==========================================
     * RESET
     * ==========================================
     */

    function resetCalculator() {

        document.querySelectorAll(".input-box").forEach(input => {

            input.value = 0;

        });

        calculateTotal();
    }


    /*
     * ==========================================
     * NUMBER FORMAT
     * ==========================================
     */
/*
    function formatNumber(number) {

        return Math.round(number).toLocaleString("en-US");

    }  */
    function formatNumber(number) {

        number = Math.round(number);
    
        if (number >= 1000000) {
            return (number / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
        }
    
        if (number >= 1000) {
            return (number / 1000).toFixed(1).replace(/\.0$/, "") + "K";
        }
    
        return number.toString();
    }


</script>

</body>
</html>
