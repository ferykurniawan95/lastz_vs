<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alliance Duel - Last Z Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px 20px 40px;
        }

        /* Styling Icon Back */
        .back-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            text-decoration: none;
            margin-bottom: 25px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1c212b;
            border: 1px solid #333;
            transition: 0.2s;
        }

        .back-icon:hover {
            color: #ffcc00;
            border-color: #ffcc00;
            transform: translateX(-3px);
        }

        .back-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Header Title & Image Icon */
        h1 {
            color: #ffcc00;
            text-align: center;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .title-icon {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        /* Urutan Vertikal (Atas ke Bawah) */
        .days {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .day-card {
            background: #1c212b;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .day-card:hover {
            border-color: #ffcc00;
            transform: translateY(-3px);
        }

        .day-number {
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
        }

        .day-text {
            margin-top: 8px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Icon Back -->
        <a class="back-icon" href="index.html" aria-label="Back">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </a>

        <!-- Header dengan vs.png -->
        <h1>
            <img src="vs.png" alt="VS" class="title-icon">
            ALLIANCE DUEL
        </h1>

        <!-- List Urut dari Atas ke Bawah -->
        <div class="days">

            <div class="day-card" onclick="selectDay(1)">
                <div class="day-number">Day 1 - Mod Vehicle Boost</div>
            </div>

            <div class="day-card" onclick="selectDay(2)">
                <div class="day-number">Day 2 - Shelter Upgrade</div>
            </div>

            <div class="day-card" onclick="selectDay(3)">
                <div class="day-number">Day 3 - Age Of Science</div>
            </div>

            <div class="day-card" onclick="selectDay(4)">
                <div class="day-number">Day 4 - Hero Progression</div>
            </div>

            <div class="day-card" onclick="selectDay(5)">
                <div class="day-number">Day 5 - Holistic Growth</div>
            </div>

            <div class="day-card" onclick="selectDay(6)">
                <div class="day-number">Day 6 - Enemy Buster</div>
            </div>

        </div>

    </div>

    <script>
        function selectDay(day) {
            window.location.href = "tasks.html?day=" + day;
        }
    </script>

</body>
</html>
